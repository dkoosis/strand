# .sandbox/project.conf — strand
PROJECT_NAME=strand

# Binaries to build (space-separated "name:path" pairs)
PROJECT_BINS="strand:./cmd/strand"

# Build system (make or mage)
BUILD_SYSTEM=make

# Single fleet pin for golangci-lint. CI and the sandbox both read this key —
# there is exactly one place this version is written (conform lint-pin rule).
GOLANGCI_LINT_VERSION=v2.12.2
