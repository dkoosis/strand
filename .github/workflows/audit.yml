name: audit

# The slow gates (race, fuzz, dupe, nilcheck, deadcode, omitempty, vuln), nightly and on
# demand. repo-standard's ci-audit-schedule rule needs a cron here and a
# step that runs make audit.
on:
  schedule:
    - cron: '41 7 * * *' # daily; off the hour to dodge GitHub's top-of-hour queue
  workflow_dispatch:

permissions:
  contents: read
  actions: read # gate reads the last green run's SHA

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false

      # dupe runs jscpd through npx.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: install linter (version pinned in .sandbox/project.conf)
        run: |
          . ./.sandbox/project.conf
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@"$GOLANGCI_LINT_VERSION"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Skip the full audit when main has not moved since its last green run;
      # vuln still runs, since new advisories can hit unchanged code.
      - name: gate
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          full=true
          last=""
          if [ "$EVENT" = schedule ]; then
            last=$(gh api "repos/${{ github.repository }}/actions/workflows/audit.yml/runs?branch=main&status=success&per_page=1" \
              --jq '.workflow_runs[0].head_sha // ""') || last=""
          fi
          if [ "$EVENT" != schedule ]; then
            why="$EVENT: full audit"
          elif [ -n "$last" ] && [ "$last" = "$GITHUB_SHA" ]; then
            full=false
            why="schedule: main unchanged since last green run ($last); vuln only"
          else
            why="schedule: main changed since last green run (${last:-none}); full audit"
          fi
          echo "audit path: $why"
          echo "full=$full" >> "$GITHUB_OUTPUT"

      - name: audit
        if: steps.gate.outputs.full == 'true'
        run: make audit

      - name: vuln
        if: steps.gate.outputs.full != 'true'
        run: make vuln
